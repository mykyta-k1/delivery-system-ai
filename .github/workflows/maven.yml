name: Java CI with Maven

on:
  push:
    branches: [ "main", "stage_3" ]
  pull_request:
    branches: [ "main", "stage_3" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
        
    - name: Run Tests
      run: ./mvnw test
